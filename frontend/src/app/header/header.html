<div class="navcomplete">

  <a routerLink="/accueil" (click)="closeMenu()">
    <img src="images/logo.png" alt="Logo de Brouilla & Mat">
  </a>

  <!-- Bouton Burger (masqué sur desktop via le CSS à venir) -->
  <button class="menu-toggle" (click)="toggleMenu()" aria-label="Menu">
    <span class="burger-icon">&#9776;</span>
    <span class="menu-text">Menu</span>
  </button>

  <nav [class.open]="isMenuOpen">
    <ul class="navgauche">
      <li><a routerLink="/accueil" routerLinkActive="active" (click)="closeMenu()">Accueil</a></li>
      <li><a routerLink="/club" routerLinkActive="active" (click)="closeMenu()">Club</a></li>
      <li><a routerLink="/bureau" routerLinkActive="active" (click)="closeMenu()">Bureau</a></li>
      <li><a routerLink="/information" routerLinkActive="active" (click)="closeMenu()">Information</a></li>
      <!-- si connecté -->
      @if (isLoggedIn()) {
        <li><a routerLink="/jouer" routerLinkActive="active" (click)="closeMenu()">Jouer</a></li>
        <li><a routerLink="/tournois" routerLinkActive="active" (click)="closeMenu()">Tournois</a></li>
      }
    </ul>

    <ul class="navdroite">
      <!-- si connecté -->
      @if (isLoggedIn()) {
        <!-- Menu pour admin et gestionnaire -->
        @if (isAdmin() || isGestionnaire()) {
          <li><a routerLink="/administration" routerLinkActive="active" (click)="closeMenu()">Administration</a></li>
        }
        <li><a routerLink="/profil" routerLinkActive="active" (click)="closeMenu()">Profil</a></li>
        <li><a routerLink="/accueil" (click)="logout(); closeMenu()">Déconnexion</a></li>
      } @else {
        <!-- si non connecté -->
        <li><a routerLink="/inscription" routerLinkActive="active" (click)="closeMenu()">Inscription</a></li>
        <li><a routerLink="/connexion" routerLinkActive="active" (click)="closeMenu()">Connexion</a></li>
      }
    </ul>
  </nav>
</div>

<h1>
  <a [routerLink]="['/accueil']" class="home-link" (click)="closeMenu()">
    Brouilla <span>&amp;</span> Mat
  </a>
</h1>
