<h1>Connexion</h1>

<form (ngSubmit)="onSubmit()">

  <label for="email">Email</label>
  <input
    type="email"
    id="email"
    name="email"
    [(ngModel)]="email"
    required
  >

  <label for="password">Mot de passe</label>
  <input
    type="password"
    id="password"
    name="password"
    [(ngModel)]="password"
    required
  >

  @if (messageErreur) {
    <p class="erreur">{{ messageErreur }}</p>
  }

  <button type="submit">Se connecter</button>

</form>
