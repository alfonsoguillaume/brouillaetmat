<h2>Connexion</h2>

<form (ngSubmit)="onSubmit()">

  <div class="mail-mdp">
    <div class="mail">
      <label for="email" class="label">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        required
      >
    </div>

    <div class="mdp">
      <label for="password" class="label">Mot de passe</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        required
      >

      <a [routerLink]="['/oublie']" class="mdp-oublie">
        Mot de passe oublié ?
      </a>

      @if (messageErreur) {
        <p class="erreur">{{ messageErreur }}</p>
      }
    </div>
  </div>

  <button type="submit" class="btn-primary">Se connecter</button>

</form>
