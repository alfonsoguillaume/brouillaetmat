<h2>Connexion</h2>

<form (ngSubmit)="onSubmit()">

  <label for="email">Email</label>
  <input
    type="email"
    id="email"
    name="email"
    [(ngModel)]="email"
    required
  >

  <label for="password">Mot de passe</label>
  <input
    [type]="afficherMotDePasse ? 'text' : 'password'"
    id="password"
    name="password"
    [(ngModel)]="password"
    required
  >

  <div class="case-afficher-mdp">
    <input type="checkbox" id="afficherMdp" [(ngModel)]="afficherMotDePasse" name="afficherMdp">
    <label for="afficherMdp">Afficher le mot de passe</label>
  </div>

  @if (messageErreur) {
    <p class="erreur">{{ messageErreur }}</p>
  }

  <button type="submit" class="btn-primary">Se connecter</button>

</form>
