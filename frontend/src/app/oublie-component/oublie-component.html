<h2>Mot de passe oublié</h2>

@if (!isSubmitted) {

  <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">

    <div class="form-fields">
      <div class="form-group">
        <label class="label" for="email">E-mail</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="votre.email@exemple.fr"
          autocomplete="email">

        <!-- Message d'erreur d'invalidation (FALC) -->
        @if (forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched) {
          <span class="erreur">Veuillez entrer une adresse e-mail valide.</span>
        }
      </div>
    </div>

    <button type="submit" class="btn-primary" [disabled]="forgotPasswordForm.invalid || envoiEnCours">
      {{ envoiEnCours ? 'Envoi en cours...' : 'Envoyer le lien de réinitialisation' }}
    </button>

  </form>

} @else {

  <p class="succes">{{ message }}</p>
  <p>Pensez à vérifier vos spams si vous ne voyez rien arriver.</p>

}
